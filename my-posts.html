<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AnonSpace - my posts</title>
    <link rel="manifest" href="/manifest.webmanifest">
    <meta name="theme-color" content="#DCCFC0">
    <link rel="icon" type="image/png" href="/icons/icon-192.png">
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
    <link rel="stylesheet" href="/theme.css">
    <script src="js/theme.js"></script>

    <script src="https://cdn.tailwindcss.com"></script>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" crossorigin="anonymous"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#059669">
    <script src="js/supabase-config.js?v=1.1"></script>
    <link rel="stylesheet" href="theme.css?v=1.1">
    
    <style>
        body {
            font-family: 'Cairo', sans-serif;
            background-color: #e5e0d8;
            color: #e5e7eb;
            overflow-x: hidden;
        }

        .bg-grid-pattern {
            background-image: radial-gradient(rgba(16, 185, 129, 0.12) 1px, transparent 1px);
            background-size: 32px 32px;
        }

        @keyframes blob {
            0%, 100% { transform: translate(0px, 0px) scale(1); }
            33% { transform: translate(30px, -50px) scale(1.1); }
            66% { transform: translate(-20px, 20px) scale(0.9); }
        }
        .animate-blob {
            animation: blob 8s infinite ease-in-out;
        }
        .animation-delay-2000 { animation-delay: 2s; }
        .animation-delay-4000 { animation-delay: 4s; }

        .glass-card {
            background: #f1f0ec;
            backdrop-filter: blur(16px);
            
        }

        .btn-shine {
            position: relative;
            overflow: hidden;
        }
        .btn-shine::after {
            content: '';
            position: absolute;
            top: -50%; left: -50%;
            width: 200%; height: 200%;
            background: linear-gradient(60deg, transparent 30%, rgba(255, 255, 255, 0.25) 50%, transparent 70%);
            transform: rotate(30deg) translateX(-100%);
            transition: transform 0.8s ease-in-out;
        }
        .btn-shine:hover::after {
            transform: rotate(30deg) translateX(100%);
        }
    </style>
</head>
<body class="min-h-screen bg-grid-pattern relative selection:bg-emerald-500 selection:text-black">

    <div class="fixed top-1/4 -right-20 w-96 h-96 bg-emerald-100/15 rounded-full blur-3xl animate-blob pointer-events-none"></div>
    <div class="fixed bottom-1/4 -left-20 w-96 h-96 bg-teal-100/15 rounded-full blur-3xl animate-blob animation-delay-2000 pointer-events-none"></div>

    <header class="sticky top-0 z-40 glass-card bg-[#DCCFC0]">
        <div class="max-w-xl mx-auto px-4 py-3 flex items-center justify-between">
            <a href="home.html" class="flex items-center gap-2 font-black text-xl text-white">
                <div class="w-8 h-8 rounded-lg bg-emerald-500 text-black flex items-center justify-center font-bold shadow-md shadow-emerald-500/20">
                    <i class="fa-solid fa-user-secret text-white"></i>
                </div>
                <span>AnonSpace</span>
            </a>
            
            <div class="flex items-center gap-2">
                <a href="about.html" class="text-xs text-gray-400 hover:text-emerald-400 transition flex items-center gap-1.5 bg-white hover:bg-gray-800/80 px-3 py-1.5 rounded-xl border border-gray-800" title="عن المنصة">
                    <i class="fa-solid fa-circle-info text-emerald-300"></i>
                    <span class="hidden sm:inline">عن المنصة</span>
                </a>

                <a href="home.html" class="p-2 w-9 h-9 text-gray-400 hover:text-emerald-400 transition rounded-xl bg-gray-300/60 hover:bg-gray-800/80 border border-gray-800 flex items-center justify-center" title="الرئيسية">
                    <i class="fa-solid fa-house text-base"></i>
                </a>

                <button id="theme-toggle" type="button" class="p-2 w-9 h-9 text-gray-400 hover:text-emerald-400 transition rounded-xl bg-gray-300/60 hover:bg-gray-800/80 border border-gray-800 flex items-center justify-center" title="الوضع الليلي">
                    <i class="fa-solid fa-moon text-base"></i>
                </button>

                <div class="relative">
                    <button id="notif-btn" onclick="toggleNotifications()" class="relative p-2 text-gray-400 hover:text-emerald-400 transition rounded-xl bg-gray-300/60 hover:bg-gray-800/80 border border-gray-800 flex items-center justify-center">
                        <i class="fa-solid fa-bell text-base"></i>
                        <span id="notif-badge" class="hidden absolute -top-1 -right-1 bg-emerald-500 text-black text-[10px] font-black rounded-full h-4 w-4 flex items-center justify-center shadow-md shadow-emerald-500/50">
                            0
                        </span>
                    </button>

                    <div id="notif-dropdown" class="hidden absolute left-0 mt-3 w-80 glass-card rounded-2xl shadow-2xl  z-50 overflow-hidden">
                        <div class="p-3  flex items-center justify-between bg-gray-900/40">
                            <span class="font-bold text-xs text-white flex items-center gap-2">
                                <i class="fa-solid fa-bell text-emerald-400"></i> الإشعارات
                            </span>
                            <button onclick="markAllAsRead()" class="text-[11px] text-white hover:underline">تحديد الكل كمعاين</button>
                        </div>

                        <div id="notif-list" class="max-h-72 overflow-y-auto divide-y divide-gray-600/40 bg-gray-900/40">
                            <div class="p-4 text-center text-black text-xs text-gray-500">لا توجد إشعارات جديدة</div>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </header>

    <main class="max-w-xl mx-auto px-4 py-6 space-y-6 relative z-10">

        <div class="glass-card rounded-2xl p-5 space-y-2 shadow-xl">
            <h1 class="text-sm font-black text-slate-800 flex items-center gap-2">
                <i class="fa-solid fa-user text-emerald-500"></i>
                <span>منشوراتي</span>
            </h1>
            <p class="text-[11px] text-gray-500 leading-relaxed">
                المنشورات التي نشرتها من هذا المتصفح. ارتباطها بمتصفحك فقط، فإن مسحت بيانات المتصفح أو غيّرت الجهاز لن تستطيع الوصول إليها من هنا.
            </p>
        </div>

        <div id="posts-container" class="space-y-4">
            <div class="text-center text-xs text-gray-500 py-8">جاري التحميل...</div>
        </div>

        <div id="load-more-wrap" class="hidden text-center">
            <button id="load-more-btn" type="button" class="btn-shine bg-emerald-500 hover:bg-emerald-400 text-black font-extrabold px-6 py-2 rounded-xl text-xs transition shadow-lg shadow-emerald-500/20">عرض المزيد</button>
        </div>

    </main>

    <div id="toast-container" class="fixed bottom-5 left-5 z-50 space-y-2"></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-config.js"></script>
    <script>window.ONLY_MINE = true;</script>
    <script src="js/app.js"></script>
    <script src="js/pwa.js"></script>
</body>
</html>
