<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AnonSpace - تفاصيل المشاركة</title>
   
    <script src="https://cdn.tailwindcss.com"></script>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Cairo', sans-serif;
            background-color: #0b0f17;
            color: #e5e7eb;
        }

        .bg-grid-pattern {
            background-image: radial-gradient(rgba(16, 185, 129, 0.12) 1px, transparent 1px);
            background-size: 32px 32px;
        }

        @keyframes blob {
            0%, 100% { transform: translate(0px, 0px) scale(1); }
            33% { transform: translate(30px, -50px) scale(1.1); }
            66% { transform: translate(-20px, 20px) scale(0.9); }
        }
        .animate-blob { animation: blob 8s infinite ease-in-out; }

        .glass-card {
            background-color: rgba(18, 24, 36, 0.7);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(31, 41, 55, 0.8);
        }

        .btn-shine {
            position: relative;
            overflow: hidden;
        }
        .btn-shine::after {
            content: '';
            position: absolute;
            top: -50%; left: -50%;
            width: 200%; height: 200%;
            background: linear-gradient(60deg, transparent 30%, rgba(255, 255, 255, 0.25) 50%, transparent 70%);
            transform: rotate(30deg) translateX(-100%);
            transition: transform 0.8s ease-in-out;
        }
        .btn-shine:hover::after {
            transform: rotate(30deg) translateX(100%);
        }
    </style>
</head>
<body class="min-h-screen bg-grid-pattern relative">

    <div class="fixed top-1/4 -right-20 w-96 h-96 bg-emerald-500/15 rounded-full blur-3xl animate-blob pointer-events-none"></div>

  
    <header class="sticky top-0 z-40 glass-card border-b border-gray-800/80">
        <div class="max-w-xl mx-auto px-4 py-3 flex items-center justify-between">
            <a href="index.html" class="flex items-center gap-2 font-black text-xl text-white">
                <i class="fa-solid fa-user-secret text-emerald-400"></i>
                <span>AnonSpace</span>
            </a>
            
            <a href="index.html" class="text-xs bg-gray-900/80 hover:bg-gray-800 text-gray-300 px-3.5 py-1.5 rounded-xl transition border border-gray-800 flex items-center gap-2">
                <i class="fa-solid fa-arrow-right"></i>
                <span>العودة للرئيسية</span>
            </a>
        </div>
    </header>

    
    <main class="max-w-xl mx-auto px-4 py-6 space-y-6 relative z-10">

        
        <div id="single-post-container" class="glass-card rounded-2xl p-5 space-y-3 shadow-xl">
            <div class="text-center text-xs text-gray-500 py-8">جاري تحميل المنشور...</div>
        </div>

        
        <div class="glass-card rounded-2xl p-4 space-y-3">
            <h3 class="text-xs font-bold text-gray-300 flex items-center gap-2">
                <i class="fa-solid fa-comment-dots text-emerald-400"></i>
                <span>أضف تعليقك المجهول</span>
            </h3>
            <div class="flex gap-2">
                <input type="text" id="comment-input" placeholder="اكتب تعليقاً..." class="flex-1 bg-gray-900/60 text-gray-100 text-xs rounded-xl p-3 border border-gray-800 focus:outline-none focus:border-emerald-500">
                <button onclick="submitComment()" class="btn-shine bg-emerald-500 hover:bg-emerald-400 text-black font-extrabold px-4 py-2 rounded-xl text-xs transition">
                    تعليق
                </button>
            </div>
        </div>

      
        <div class="space-y-3">
            <h4 class="text-xs font-bold text-gray-400 px-1">التعليقات</h4>
            <div id="comments-container" class="space-y-2">
                
            </div>
        </div>

    </main>

    <div id="toast-container" class="fixed bottom-5 left-5 z-50 space-y-2"></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-config.js"></script>
    <script src="js/post-details.js"></script>
</body>
</html>
