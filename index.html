<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AnonSpace - المساحة الرئيسية</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Font: Cairo -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Cairo', sans-serif;
            background-color: #0b0f17;
            color: #e5e7eb;
        }

        
        .bg-grid-pattern {
            background-image: radial-gradient(rgba(16, 185, 129, 0.12) 1px, transparent 1px);
            background-size: 32px 32px;
        }

        @keyframes blob {
            0%, 100% { transform: translate(0px, 0px) scale(1); }
            33% { transform: translate(30px, -50px) scale(1.1); }
            66% { transform: translate(-20px, 20px) scale(0.9); }
        }
        .animate-blob {
            animation: blob 8s infinite ease-in-out;
        }
        .animation-delay-2000 { animation-delay: 2s; }
        .animation-delay-4000 { animation-delay: 4s; }

        
        .glass-card {
            background-color: rgba(18, 24, 36, 0.7);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(31, 41, 55, 0.8);
        }

        
        .btn-shine {
            position: relative;
            overflow: hidden;
        }
        .btn-shine::after {
            content: '';
            position: absolute;
            top: -50%; left: -50%;
            width: 200%; height: 200%;
            background: linear-gradient(60deg, transparent 30%, rgba(255, 255, 255, 0.25) 50%, transparent 70%);
            transform: rotate(30deg) translateX(-100%);
            transition: transform 0.8s ease-in-out;
        }
        .btn-shine:hover::after {
            transform: rotate(30deg) translateX(100%);
        }
    </style>
</head>
<body class="min-h-screen bg-grid-pattern relative selection:bg-emerald-500 selection:text-black">

   
    <div class="fixed top-1/4 -right-20 w-96 h-96 bg-emerald-500/15 rounded-full blur-3xl animate-blob pointer-events-none"></div>
    <div class="fixed bottom-1/4 -left-20 w-96 h-96 bg-teal-500/15 rounded-full blur-3xl animate-blob animation-delay-2000 pointer-events-none"></div>

    
    <header class="sticky top-0 z-40 glass-card border-b border-gray-800/80">
        <div class="max-w-xl mx-auto px-4 py-3 flex items-center justify-between">
            <a href="index.html" class="flex items-center gap-2 font-black text-xl text-white">
                <div class="w-8 h-8 rounded-lg bg-emerald-500 text-black flex items-center justify-center font-bold shadow-md shadow-emerald-500/20">
                    <i class="fa-solid fa-user-secret text-base"></i>
                </div>
                <span>AnonSpace</span>
            </a>
            
            <a href="about.html" class="text-xs text-gray-300 hover:text-emerald-400 transition flex items-center gap-1.5 bg-gray-900/60 hover:bg-gray-800/80 px-3.5 py-1.5 rounded-xl border border-gray-800">
                <i class="fa-solid fa-circle-info text-emerald-400"></i>
                <span>عن المنصة</span>
            </a>
        </div>
    </header>

    
    <main class="max-w-xl mx-auto px-4 py-6 space-y-6 relative z-10">

        
        <div class="glass-card rounded-2xl p-5 space-y-4 shadow-xl">
            <textarea id="post-content" rows="3" placeholder="بوح بما في خاطرك بكل حرية وبدون إظهار هوينك..." class="w-full bg-gray-900/50 text-gray-100 placeholder-gray-500 rounded-xl p-3 text-sm border border-gray-800 focus:outline-none focus:border-emerald-500/60 transition resize-none"></textarea>

            
            <div id="image-preview-container" class="relative hidden rounded-xl overflow-hidden border border-gray-800 max-h-48 bg-black/50">
                <img id="image-preview" src="" class="w-full object-cover max-h-48" alt="معاينة">
                <button onclick="removeSelectedImage()" class="absolute top-2 left-2 bg-red-600/80 hover:bg-red-600 text-white rounded-full w-7 h-7 flex items-center justify-center text-xs transition">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <div class="flex items-center justify-between pt-2 border-t border-gray-800/60">
                <div class="flex items-center gap-3">
                    <select id="post-category" class="bg-gray-900/80 text-gray-300 border border-gray-800 rounded-xl text-xs px-3 py-2 focus:outline-none focus:border-emerald-500">
                        <option value="عام">عام</option>
                        <option value="أسرار">أسرار</option>
                        <option value="مشاعر">مشاعر</option>
                        <option value="نصائح">نصائح</option>
                        <option value="تساؤلات">تساؤلات</option>
                    </select>

                    <label class="cursor-pointer text-gray-400 hover:text-emerald-400 text-sm transition flex items-center gap-1.5 px-2 py-1.5 rounded-lg bg-gray-900/40 border border-gray-800">
                        <i class="fa-solid fa-image"></i>
                        <span class="text-xs">صورة</span>
                        <input type="file" id="post-image-input" accept="image/*" onchange="previewImage(event)" class="hidden">
                    </label>
                </div>

                <button id="submit-btn" onclick="submitPost()" class="btn-shine bg-emerald-500 hover:bg-emerald-400 text-black font-extrabold px-5 py-2 rounded-xl text-xs transition shadow-lg shadow-emerald-500/20 flex items-center gap-2">
                    <span>بوح الآن</span>
                    <i class="fa-solid fa-paper-plane text-xs"></i>
                </button>
            </div>
        </div>

        
        <div class="flex items-center gap-2 overflow-x-auto py-1 no-scrollbar">
            <button onclick="filterCategory('الكل', this)" class="category-btn bg-emerald-500 text-black font-bold px-4 py-1.5 rounded-xl text-xs transition shadow-md shadow-emerald-500/10 whitespace-nowrap">الكل</button>
            <button onclick="filterCategory('أسرار', this)" class="category-btn text-gray-400 hover:text-white px-4 py-1.5 rounded-xl text-xs transition whitespace-nowrap">أسرار</button>
            <button onclick="filterCategory('مشاعر', this)" class="category-btn text-gray-400 hover:text-white px-4 py-1.5 rounded-xl text-xs transition whitespace-nowrap">مشاعر</button>
            <button onclick="filterCategory('نصائح', this)" class="category-btn text-gray-400 hover:text-white px-4 py-1.5 rounded-xl text-xs transition whitespace-nowrap">نصائح</button>
            <button onclick="filterCategory('تساؤلات', this)" class="category-btn text-gray-400 hover:text-white px-4 py-1.5 rounded-xl text-xs transition whitespace-nowrap">تساؤلات</button>
        </div>

       
        <div id="posts-container" class="space-y-4">
           
        </div>

    </main>

    
    <div id="toast-container" class="fixed bottom-5 left-5 z-50 space-y-2"></div>

    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-config.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
